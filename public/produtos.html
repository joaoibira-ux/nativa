<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Produtos" />
  <title>NATIVA - Produtos</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./style.css?v=12" />
</head>
<body>

<header>
  <a class="btn-voltar-header" href="./menu.html">← Menu</a>
  <span class="titulo">Produtos</span>
  <span id="versao-app" class="header-versao"></span>
</header>

<div id="lista" class="lista"></div>
<button class="fab" id="fab" onclick="abrirFormulario()">+</button>

<div id="form-overlay" class="form-overlay" style="display:none">
  <div class="form-scroll">
    <form id="form" novalidate>
      <div class="form-row">
        <div class="form-group full">
          <label>Nome *</label>
          <input type="text" id="f-nome" placeholder="Nome do produto" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>UD</label>
          <select id="f-ud">
            <option value="Kg">Kg</option>
            <option value="Gr">Gr</option>
            <option value="Ud">Ud</option>
          </select>
        </div>
        <div class="form-group">
          <label>Valor (R$)</label>
          <input type="text" inputmode="decimal" id="f-valor" placeholder="0,00" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full">
          <label>Estoque</label>
          <input type="number" step="any" id="f-estoque" placeholder="0" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full">
          <label>Composição (Matérias-Primas)</label>
        </div>
      </div>
      <div id="composicao-container"></div>
      <button type="button" class="btn-add-item" onclick="adicionarComposicaoItem()">+ Adicionar matéria-prima</button>
      <div class="form-actions">
        <button type="button" class="btn-cancel" onclick="fecharFormulario()">Cancelar</button>
        <button type="button" class="btn-save" onclick="salvarItem()">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script src="./app.js?v=16"></script>
<script src="./estoque.js?v=5" data-api="produtos"></script>
</body>
</html>

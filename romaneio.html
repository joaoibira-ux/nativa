<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Romaneio" />
  <title>NATIVA - Romaneio de Produção</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./style.css?v=22" />
</head>
<body>

<header>
  <a class="btn-voltar-header" href="./menu.html">← Menu</a>
  <span class="titulo">Romaneio de Produção</span>
  <span id="versao-app" class="header-versao"></span>
</header>

<div id="lista" class="lista"><div class="loading-inline"><div class="spinner"></div><span>Carregando...</span></div></div>

<div id="barra-selecao" class="romaneio-barra" style="display:none">
  <span id="romaneio-contador">0 pedidos selecionados</span>
  <button class="btn-save" onclick="gerarRomaneio()">Gerar romaneio</button>
</div>

<div id="resultado-overlay" class="form-overlay" style="display:none">
  <div class="form-scroll">
    <div class="romaneio-resultado-header">
      <span class="titulo">Romaneio gerado</span>
      <span id="romaneio-resultado-meta"></span>
    </div>
    <div id="romaneio-resultado-lista"></div>
    <div class="form-actions">
      <button type="button" class="btn-save" onclick="fecharResultado()">Fechar</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="./app.js?v=29"></script>
<script src="./romaneio.js?v=3"></script>
</body>
</html>
